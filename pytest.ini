[pytest]
# Coletar apenas os testes do proprio bounty-hunter.
# O diretorio work/ contem repositorios de terceiros clonados (bounties em
# andamento) e nao deve ser varrido: alguns fazem sys.exit() no import quando
# faltam dependencias (ex.: torch), o que quebra a coleta do pytest inteira.
testpaths = tests
norecursedirs = work results logs .git
